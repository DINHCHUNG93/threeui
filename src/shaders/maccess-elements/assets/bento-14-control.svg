<svg width="414" height="390" viewBox="0 0 414 390" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
.flowPulse, .clickRipple, .tapRing { opacity: 0; }
@media (prefers-reduced-motion: no-preference) {
  .flowPulse { opacity: 1; stroke-dasharray: 22 78; animation: controlFlow 3.2s linear infinite; }
  @keyframes controlFlow {
    0% { stroke-dashoffset: 100; stroke-opacity: 0; }
    14% { stroke-opacity: .9; }
    48% { stroke-dashoffset: 22; stroke-opacity: .9; }
    60% { stroke-dashoffset: 22; stroke-opacity: 0; }
    100% { stroke-dashoffset: 22; stroke-opacity: 0; }
  }
  .clickRipple { opacity: 1; animation: controlRipple 3.2s linear infinite; }
  @keyframes controlRipple {
    0%, 46% { r: 4; stroke-opacity: 0; }
    54% { stroke-opacity: .6; }
    88% { r: 15; stroke-opacity: 0; }
    100% { r: 15; stroke-opacity: 0; }
  }
  .tapRing { opacity: 1; animation: controlTap 3.2s linear infinite; }
  @keyframes controlTap {
    0% { r: 5; stroke-opacity: .65; }
    26% { r: 12; stroke-opacity: 0; }
    100% { r: 12; stroke-opacity: 0; }
  }
  .cursorNudge { animation: controlCursor 3.2s ease-in-out infinite; }
  @keyframes controlCursor {
    0%, 40% { transform: translate(0, 0); }
    52%, 100% { transform: translate(-3px, -3px); }
  }
}
</style>
