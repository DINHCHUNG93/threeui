:root{
  --ink:#fdf7ec;
  --ink-soft:rgba(253,247,236,.62);
  --ink-faint:rgba(253,247,236,.44);
  --rule:rgba(255,246,230,.06);

  --card:#f1e9dd;
  --card-ink:#2b241b;
  --card-body:#6b6053;
  --card-label:#8c8173;
  --hair:rgba(43,36,27,.14);

  --olive:#86895a;
  --terra:#b06a52;
  --amber:#c9993f;

  --ease:cubic-bezier(.22,.61,.36,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ui:'Lexend',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#4a4034}
body{
  font-family:var(--ui);font-weight:300;color:var(--ink);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  cursor:default;-webkit-user-select:none;user-select:none;
}

/* the desk sits in the same pool of light as the reference: a near-flat
   olive field, dark in the top-right, opening out along the bottom edge */
#desk{
  position:fixed;inset:0;isolation:isolate;
  background:
    radial-gradient(64% 52% at 27% 84%, rgba(247,238,221,.10) 0%, rgba(247,238,221,0) 72%),
    radial-gradient(70% 60% at 92% 8%,  rgba(28,20,12,.12) 0%, rgba(28,20,12,0) 68%),
    #5e5142;
}
#desk::before{                       /* column guides */
  content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
  background:repeating-linear-gradient(90deg, var(--rule) 0 1px, transparent 1px 200px);
  -webkit-mask-image:linear-gradient(180deg, transparent 0%, #000 12%, #000 74%, transparent 100%);
  mask-image:linear-gradient(180deg, transparent 0%, #000 12%, #000 74%, transparent 100%);
}
#desk::after{                        /* the floor of light */
  content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(72% 44% at 50% 117%, rgba(250,241,224,.58) 0%, rgba(250,241,224,.25) 42%, rgba(250,241,224,.05) 72%, rgba(250,241,224,0) 88%),
    linear-gradient(180deg, rgba(250,241,224,0) 50%, rgba(250,241,224,.04) 76%, rgba(250,241,224,.11) 100%);
}
#wins{position:relative;z-index:2}

/* ------------------------------------------------------------------ windows */
.win{position:absolute}
.chrome{
  position:absolute;left:0;top:0;width:100%;height:100%;
  background:var(--card);border-radius:30px;overflow:hidden;
  box-shadow:0 2px 6px rgba(28,20,12,.13), 0 30px 70px rgba(28,20,12,.32);
  transition:box-shadow .8s var(--ease);
  display:flex;flex-direction:column;
}
.win.active .chrome{box-shadow:0 4px 12px rgba(28,20,12,.18), 0 38px 84px rgba(28,20,12,.42)}
.win.genie > .chrome{visibility:hidden}
.win.closing > .chrome{transition:opacity .2s var(--ease), transform .2s var(--ease);opacity:0;transform:scale(.95)}
.win.opening > .chrome{animation:winIn .34s var(--ease-out)}
@keyframes winIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}

.titlebar{
  height:38px;flex:0 0 38px;position:relative;
  display:flex;align-items:center;
  cursor:grab;background:transparent;
}
.win.dragging .titlebar{cursor:grabbing}
.lights{display:flex;gap:9px;align-items:center;padding-left:16px;position:relative;z-index:2}
.dot{
  width:11px;height:11px;border-radius:50%;
  background:rgba(43,36,27,.12);
  display:grid;place-items:center;
  font:500 8px/1 var(--ui);color:transparent;
  padding:0;border:0;transition:background .35s var(--ease);
}
.dot::after{content:"";opacity:0;transition:opacity .2s var(--ease)}
.win.active .dot:nth-child(1){background:var(--terra)}
.win.active .dot:nth-child(2){background:var(--amber)}
.win.active .dot:nth-child(3){background:var(--olive)}
.lights:hover .dot::after{opacity:1}
.dot:nth-child(1)::after{content:"✕";font-size:7px;color:rgba(44,20,10,.6)}
.dot:nth-child(2)::after{content:"–";font-size:10px;margin-top:-1px;color:rgba(46,32,4,.6)}
.dot:nth-child(3)::after{content:"⤢";font-size:7px;color:rgba(28,30,10,.6);transform:rotate(90deg)}
.dot.mid{cursor:pointer}
.title{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:13px;font-weight:300;letter-spacing:.01em;color:rgba(140,129,115,.55);
  pointer-events:none;transition:color .4s var(--ease);
}
.win.active .title{color:var(--card-label)}
.content{flex:1 1 auto;position:relative;overflow:hidden;background:var(--card)}

/* photos — the plate is inset in the card, the way the reference frames
   every photograph */
.shot{
  position:absolute;inset:0 14px 14px;border-radius:22px;
  background-size:cover;background-position:center;display:block;
  box-shadow:inset 0 0 0 1px rgba(28,20,12,.08);
}

/* notes */
.note{padding:2px 22px 0}
.note .day{font-size:12px;font-weight:300;color:var(--card-label);text-align:center;margin-bottom:14px}
.note h2{font:400 22px/1.15 var(--ui);letter-spacing:-.02em;margin:0 0 8px;color:var(--card-ink)}
.note p{font-size:13.5px;line-height:1.5;font-weight:300;color:var(--card-body);margin:0 0 12px}
.note .row{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;line-height:1.45;font-weight:300;color:var(--card-body);margin-bottom:8px}
.note .tick{
  width:16px;height:16px;flex:0 0 16px;margin-top:1px;border-radius:50%;
  background:var(--terra);display:grid;place-items:center;
}
.note .tick svg{display:block}
.note .hair{height:1px;background:var(--hair);margin:2px 0 14px}

/* music */
.player{display:flex;align-items:center;gap:14px;padding:6px 18px 16px}
.art{
  width:58px;height:58px;flex:0 0 58px;border-radius:16px;
  background:linear-gradient(148deg,#efd6a6 0%,#d08a57 38%,#a4553c 66%,#3f2e22 100%);
  box-shadow:0 4px 14px rgba(28,20,12,.24), inset 0 0 0 1px rgba(255,246,232,.20);
}
.player .meta{min-width:0;flex:1}
.player .t{font-size:14px;font-weight:400;letter-spacing:-.01em;color:var(--card-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .a{font-size:12.5px;font-weight:300;color:var(--card-label);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .bar{margin-top:9px;height:2px;border-radius:2px;background:rgba(43,36,27,.13);overflow:hidden}
.player .bar i{display:block;height:100%;width:38%;background:var(--card-body);border-radius:2px}
.player .times{display:flex;justify-content:space-between;font-size:10.5px;font-weight:300;color:var(--card-label);margin-top:5px}
/* the transport buttons are the reference's little white knobs */
.transport{display:flex;align-items:center;gap:8px;padding:0 2px}
.transport svg{display:block;color:#4a4034;opacity:1}
.transport .knob{
  width:30px;height:30px;border-radius:50%;background:#fdf8f0;
  display:grid;place-items:center;cursor:pointer;
  box-shadow:0 3px 9px rgba(28,20,12,.17);
  transition:transform .5s var(--ease-out), background .4s var(--ease);
}
.transport .knob.big{width:38px;height:38px}
.transport .knob:hover{transform:scale(1.1);background:#fffdf9}

/* settings */
.pane{padding:4px 24px 0}
.pane h1{font:400 26px/1.05 var(--ui);letter-spacing:-.03em;margin:0 0 10px;color:var(--card-ink)}
.pane p{font-size:13.5px;line-height:1.5;font-weight:300;color:var(--card-body);margin:0 0 18px;max-width:38ch}
.pane .field{
  display:block;width:100%;height:42px;border-radius:999px;
  border:1px solid var(--hair);background:rgba(255,252,246,.62);
  font:300 13.5px/1 var(--ui);color:var(--card-ink);padding:0 18px;
  transition:border-color .4s var(--ease), box-shadow .5s var(--ease), background .4s var(--ease);
  -webkit-user-select:auto;user-select:auto;
}
.pane .field::placeholder{color:var(--card-label)}
.pane .field:focus{
  outline:none;background:#fffdf8;border-color:rgba(176,106,82,.72);
  box-shadow:0 0 0 4px rgba(176,106,82,.16), 0 6px 18px rgba(28,20,12,.11);
}
.pane .row{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin-top:18px;font-size:13.5px;font-weight:300;color:var(--card-body);
}
.sw{
  appearance:none;-webkit-appearance:none;margin:0;
  width:44px;height:26px;border-radius:999px;background:rgba(43,36,27,.15);
  position:relative;cursor:pointer;flex:0 0 44px;
  transition:background .3s var(--ease);
}
.sw::after{
  content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#fdf8f0;box-shadow:0 2px 5px rgba(28,20,12,.26);
  transition:transform .3s var(--ease-out);
}
.sw:checked{background:var(--terra)}
.sw:checked::after{transform:translateX(18px)}

.pane h1,.pane p,.pane .row span,.note h2,.note p,.note .row{-webkit-user-select:text;user-select:text}

/* ------------------------------------------------------------------ genie */
.slices{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none}
.win.genie .slices{pointer-events:auto}
.slices .chrome{box-shadow:none}
.slice{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;will-change:transform;backface-visibility:hidden}
.slice-inner{position:absolute;left:0}
.genie-svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}

/* ------------------------------------------------------------------ dock */
#dock{
  /* the icon squircle (|x|^5+|y|^5=1 on 54px) carries a 12px corner, so the
     dock's own corner is that plus its inset — the two stay concentric */
  --pad:8px; --icon-r:12px;
  position:absolute;z-index:5;left:50%;bottom:14px;transform:translateX(-50%);
  display:flex;align-items:flex-end;gap:8px;
  padding:var(--pad);border-radius:calc(var(--icon-r) + var(--pad));
  background:rgba(40,31,22,.34);
  backdrop-filter:blur(26px) saturate(150%);
  -webkit-backdrop-filter:blur(26px) saturate(150%);
  box-shadow:
    inset 0 0 0 1px rgba(255,246,232,.14),
    0 18px 46px rgba(22,15,8,.42);
}
.slot{width:54px;height:54px;position:relative;cursor:pointer;display:block}
.slot svg.icon{
  display:block;width:54px;height:54px;
  filter:drop-shadow(0 4px 10px rgba(22,15,8,.36));
  transition:transform .5s var(--ease-out);
}
.slot:hover svg.icon{transform:translateY(-2px)}
.slot:active svg.icon{transform:scale(.93)}
.slot .run{
  position:absolute;left:50%;bottom:-6px;width:3.5px;height:3.5px;margin-left:-1.75px;
  border-radius:50%;background:rgba(253,247,236,.58);opacity:0;transition:opacity .3s var(--ease);
}
.slot.running .run{opacity:1}
.slot .tip{
  position:absolute;left:50%;bottom:70px;transform:translateX(-50%) translateY(5px);
  padding:5px 13px;border-radius:999px;white-space:nowrap;
  background:rgba(38,29,20,.74);backdrop-filter:blur(14px);
  box-shadow:inset 0 0 0 1px rgba(255,246,232,.15), 0 8px 22px rgba(22,15,8,.36);
  font-size:12.5px;font-weight:300;letter-spacing:.01em;color:#f1e9dd;
  opacity:0;pointer-events:none;transition:opacity .3s var(--ease), transform .4s var(--ease-out);
}
.slot:hover .tip{opacity:1;transform:translateX(-50%) translateY(0)}
.dock-sep{width:1px;height:40px;margin:0 6px;align-self:center;background:rgba(255,246,232,.17)}
</style>
</head>
<body>
<div id="desk">
  <div id="wins"></div>
  <div id="dock"></div>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="icondefs"></defs></svg>

<script>
"use strict";
/* ======================================================================= data */
const REFW = 1085;

/* an Apple-ish squircle, |x|^n+|y|^n=1 with n=5, in a 0..100 box */
const SQ = (function(){
  const n=5, pts=[];
  for(let i=0;i<=96;i++){
    const a=i/96*Math.PI*2;
    const c=Math.cos(a), s=Math.sin(a);
    const x=Math.sign(c)*Math.pow(Math.abs(c),2/n);
    const y=Math.sign(s)*Math.pow(Math.abs(s),2/n);
    pts.push((50+x*50).toFixed(2)+' '+(50+y*50).toFixed(2));
  }
  return 'M'+pts.join('L')+'Z';
})();
document.getElementById('icondefs').innerHTML =
  '<clipPath id="sqclip" clipPathUnits="objectBoundingBox" transform="scale(0.01)"><path d="'+SQ+'"/></clipPath>';

const ICON = {
  finder:()=>''+
    '<defs><linearGradient id="fnA" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0" stop-color="#3f9bf5"/><stop offset="1" stop-color="#0a63d6"/></linearGradient>'+
    '<linearGradient id="fnB" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbe9fb"/></linearGradient></defs>'+
    '<g clip-path="url(#sqclip)">'+
      '<rect x="0" y="0" width="50" height="100" fill="url(#fnA)"/>'+
      '<rect x="50" y="0" width="50" height="100" fill="url(#fnB)"/>'+
      '<rect x="35" y="31" width="4.4" height="13" rx="2.2" fill="#12305e"/>'+
      '<rect x="61" y="31" width="4.4" height="13" rx="2.2" fill="#12305e"/>'+
      '<path d="M31 57 C40 70 60 70 69 57" stroke="#12305e" stroke-width="4.4" fill="none" stroke-linecap="round"/>'+
    '</g>'+
    '<path d="'+SQ+'" fill="none" stroke="rgba(0,0,0,.10)" stroke-width="1"/>',
  safari:()=>''+
    '<defs><linearGradient id="sfA" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0" stop-color="#22a2f5"/><stop offset="1" stop-color="#0a63d8"/></linearGradient>'+
    '<radialGradient id="sfB" cx="50%" cy="50%" r="50%">'+
      '<stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef4fb"/></radialGradient></defs>'+
    '<g clip-path="url(#sqclip)">'+
      '<rect width="100" height="100" fill="url(#sfA)"/>'+
      '<circle cx="50" cy="50" r="37" fill="url(#sfB)"/>'+
      '<circle cx="50" cy="50" r="33" fill="none" stroke="#c9d8e8" stroke-width="1"/>'+
      '<g stroke="#8fa6bd" stroke-width="1.4" stroke-linecap="round">'+
        '<path d="M50 15v5M50 80v5M15 50h5M80 50h5"/></g>'+
      '<path d="M68 32 L44 44 L32 68 L56 56 Z" fill="#f5f5f7"/>'+
      '<path d="M68 32 L44 44 L50 50 Z" fill="#ff4f4a"/>'+
      '<path d="M32 68 L56 56 L50 50 Z" fill="#ffffff"/>'+
    '</g>'+
    '<path d="'+SQ+'" fill="none" stroke="rgba(0,0,0,.10)" stroke-width="1"/>',
  music:()=>''+
    '<defs><linearGradient id="msA" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0" stop-color="#fc5c7d"/><stop offset="1" stop-color="#f4245a"/></linearGradient></defs>'+
    '<g clip-path="url(#sqclip)">'+
      '<rect width="100" height="100" fill="url(#msA)"/>'+
      '<path d="M40 68V33l30-7v33" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>'+
      '<ellipse cx="33" cy="69" rx="9" ry="7.5" fill="#fff"/>'+
      '<ellipse cx="63" cy="62" rx="9" ry="7.5" fill="#fff"/>'+
    '</g>'+
    '<path d="'+SQ+'" fill="none" stroke="rgba(0,0,0,.10)" stroke-width="1"/>',
  photos:()=>{
    const cols=['#f7c948','#f79a3c','#ef5a5a','#d4519f','#8f5fd6','#4f7ee8','#39b7e6','#5cc95c'];
    let g='';
    for(let i=0;i<8;i++){
      g+='<ellipse cx="50" cy="30" rx="11" ry="20" fill="'+cols[i]+'" opacity=".92" '+
         'transform="rotate('+(i*45)+' 50 50)" style="mix-blend-mode:multiply"/>';
    }
    return '<g clip-path="url(#sqclip)"><rect width="100" height="100" fill="#fff"/>'+g+'</g>'+
           '<path d="'+SQ+'" fill="none" stroke="rgba(0,0,0,.10)" stroke-width="1"/>';
  },
  notes:()=>''+
    '<g clip-path="url(#sqclip)">'+
      '<rect width="100" height="100" fill="#fdfdfd"/>'+
      '<rect width="100" height="26" fill="#febc2e"/>'+
      '<g stroke="#d9d9de" stroke-width="4" stroke-linecap="round">'+
        '<path d="M20 44h60M20 60h60M20 76h38"/></g>'+
    '</g>'+
    '<path d="'+SQ+'" fill="none" stroke="rgba(0,0,0,.12)" stroke-width="1"/>',
  settings:()=>{
    const gear=(cx,cy,r,teeth,rot)=>{
      let d='';
      for(let i=0;i<teeth;i++){
        const a=(i/teeth)*Math.PI*2+rot, w=Math.PI/teeth*0.42;
        const p=(ang,rr)=>((cx+Math.cos(ang)*rr).toFixed(2)+' '+(cy+Math.sin(ang)*rr).toFixed(2));
        d+=(i?'L':'M')+p(a-w,r)+'L'+p(a-w*0.62,r*1.32)+'L'+p(a+w*0.62,r*1.32)+'L'+p(a+w,r);
      }
      return '<path d="'+d+'Z" fill="#fff"/><circle cx="'+cx+'" cy="'+cy+'" r="'+(r*0.42)+'" fill="#7b7b81"/>';
    };
    return '<defs><linearGradient id="stA" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0" stop-color="#a9a9b0"/><stop offset="1" stop-color="#6e6e76"/></linearGradient></defs>'+
      '<g clip-path="url(#sqclip)"><rect width="100" height="100" fill="url(#stA)"/>'+
      gear(41,44,20,9,0.2)+gear(70,70,12,8,0.4)+'</g>'+
      '<path d="'+SQ+'" fill="none" stroke="rgba(0,0,0,.10)" stroke-width="1"/>';
  },
  trash:()=>''+
    '<defs>'+
      '<linearGradient id="trB" x1="0" y1="0" x2="1" y2="0">'+
        '<stop offset="0" stop-color="#ffffff" stop-opacity=".40"/>'+
        '<stop offset=".22" stop-color="#ffffff" stop-opacity=".14"/>'+
        '<stop offset=".62" stop-color="#ffffff" stop-opacity=".20"/>'+
        '<stop offset="1" stop-color="#ffffff" stop-opacity=".44"/>'+
      '</linearGradient>'+
      '<linearGradient id="trR" x1="0" y1="0" x2="1" y2="0">'+
        '<stop offset="0" stop-color="#ffffff" stop-opacity=".85"/>'+
        '<stop offset=".5" stop-color="#ffffff" stop-opacity=".55"/>'+
        '<stop offset="1" stop-color="#ffffff" stop-opacity=".9"/>'+
      '</linearGradient>'+
    '</defs>'+
    '<g transform="translate(50 51) scale(1.24) translate(-50 -50)">'+
      /* the far wall of the basket, seen through the mouth */
      '<path d="M24.5 30 L30.5 78 a19.5 5.4 0 0 0 39 0 L75.5 30 Z" fill="#141811" fill-opacity=".16"/>'+
      '<g stroke="#ffffff" stroke-opacity=".13" stroke-width="1.3" stroke-linecap="round">'+
        '<path d="M35.5 31 L38.6 77"/><path d="M50 31 L50 79"/><path d="M64.5 31 L61.4 77"/>'+
      '</g>'+
      /* body */
      '<path d="M24.5 30 L30.5 78 a19.5 5.4 0 0 0 39 0 L75.5 30 Z" fill="url(#trB)"/>'+
      /* the wires: front ribs follow the taper, two hoops cross them */
      '<g stroke="#ffffff" stroke-opacity=".42" stroke-width="1.7" stroke-linecap="round" fill="none">'+
        '<path d="M31.2 31.5 L36 76.4"/>'+
        '<path d="M40.6 32 L42.9 78.6"/>'+
        '<path d="M50 32.2 L50 79"/>'+
        '<path d="M59.4 32 L57.1 78.6"/>'+
        '<path d="M68.8 31.5 L64 76.4"/>'+
      '</g>'+
      '<g stroke="#ffffff" stroke-opacity=".30" stroke-width="1.5" fill="none">'+
        '<path d="M27.2 47.5 a23.5 5 0 0 0 45.6 0"/>'+
        '<path d="M29.2 63.5 a21 4.6 0 0 0 41.6 0"/>'+
      '</g>'+
      /* base */
      '<path d="M30.5 78 a19.5 5.4 0 0 0 39 0" fill="none" stroke="url(#trR)" stroke-width="2.4" stroke-linecap="round"/>'+
      /* mouth */
      '<ellipse cx="50" cy="30" rx="25.5" ry="7" fill="#141811" fill-opacity=".26"/>'+
      '<ellipse cx="50" cy="30" rx="25.5" ry="7" fill="none" stroke="url(#trR)" stroke-width="2.6"/>'+
      '<ellipse cx="50" cy="31.4" rx="21.6" ry="5.2" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.2"/>'+

/* ======================================================================= util */
function bezier(x1,y1,x2,y2){
  const cx=3*x1, bx=3*(x2-x1)-cx, ax=1-cx-bx;
  const cy=3*y1, by=3*(y2-y1)-cy, ay=1-cy-by;
  const fx=t=>((ax*t+bx)*t+cx)*t, fy=t=>((ay*t+by)*t+cy)*t, dfx=t=>(3*ax*t+2*bx)*t+cx;
  return function(x){
    if(x<=0) return 0; if(x>=1) return 1;
    let t=x;
    for(let i=0;i<8;i++){
      const e=fx(t)-x; if(Math.abs(e)<1e-6) break;
      const d=dfx(t); if(Math.abs(d)<1e-6) break;
      t-=e/d;
    }
    return fy(t<0?0:t>1?1:t);
  };
}
function invert(fn){
  return function(y){ let lo=0,hi=1; for(let i=0;i<24;i++){const m=(lo+hi)/2; if(fn(m)<y) lo=m; else hi=m;} return (lo+hi)/2; };
}
const EASE_TOP = bezier(0.558,0.137,0.456,0.719);
const EASE_BOT = bezier(0.558,0.000,0.890,0.993);
const EASE_TOP_INV = invert(EASE_TOP);
function tbl(arr,t){
  if(t<=0) return arr[0];
  if(t>=1) return arr[arr.length-1];
  const f=t*(arr.length-1), i=Math.floor(f), k=f-i;
  return arr[i]+(arr[i+1]-arr[i])*k;
}
function clamp(v,a,b){return v<a?a:v>b?b:v;}

/* maps the rect (0,0,w,h) onto the quad p0(tl) p1(tr) p2(br) p3(bl) */
function quadMatrix(w,h,x0,y0,x1,y1,x2,y2,x3,y3){
  const sx=x0-x1+x2-x3, sy=y0-y1+y2-y3;
  let a,b,c,d,e,f,g,hh;
  if(Math.abs(sx)<1e-9 && Math.abs(sy)<1e-9){
    a=x1-x0; b=x2-x1; c=x0; d=y1-y0; e=y2-y1; f=y0; g=0; hh=0;
  }else{
    const dx1=x1-x2, dx2=x3-x2, dy1=y1-y2, dy2=y3-y2;
    const den=dx1*dy2-dx2*dy1;
    g=(sx*dy2-dx2*sy)/den;
    hh=(dx1*sy-sx*dy1)/den;
    a=x1-x0+g*x1; b=x3-x0+hh*x3; c=x0;
    d=y1-y0+g*y1; e=y3-y0+hh*y3; f=y0;
  }
  a/=w; d/=w; g/=w; b/=h; e/=h; hh/=h;
  return 'matrix3d('+a+','+d+',0,'+g+','+b+','+e+',0,'+hh+',0,0,1,0,'+c+','+f+',0,1)';
}

/* the cluster is centred horizontally and sits centred in the space above
   the dock, so the desktop stays balanced at any window size */
const CLUSTER = {top:108, bottom:574}, DOCK_SPACE = 104;
function xoff(){ return Math.round((window.innerWidth - REFW)/2); }
function yoff(){
  return Math.max(0, Math.round((window.innerHeight - DOCK_SPACE - (CLUSTER.bottom-CLUSTER.top))/2 - CLUSTER.top));
}
let curX = xoff(), curY = yoff();
function layout(){ wins.forEach(place); measureDock(); }
function place(w){
  w.el.style.left = w.x + 'px';
  w.el.style.top  = w.y + 'px';
  w.el.style.width  = w.w+'px';
  w.el.style.height = w.h+'px';
  w.slicesEl.style.left = (-w.x)+'px';
  w.slicesEl.style.top  = (-w.y)+'px';
}

/* the dock target is measured on layout, never per frame */
function measureDock(){
  wins.forEach(w=>{
    const r=w.slot.getBoundingClientRect();
    w.dockCx = r.left + r.width/2;
    w.dockCy = r.top + r.height/2;
  });
}

/* ======================================================================= genie */
function funnelAt(w, y, geo){
  const t = clamp((y - geo.yb)/(geo.yd - geo.yb), 0, 1);
  const s = tbl(SIG,t), g = tbl(GAM,t);
  const cx = geo.cw + (geo.cd - geo.cw)*g;
  const half = (w.w/2)*s;
  return [cx-half, cx+half, s];
}
function geoFor(w){
  return {
    cw: w.x + w.w/2,
    cd: w.dockCx,
    yb: w.restY + w.h,
    yd: w.dockCy - DOCK_LIFT,
    dockY: w.dockCy - DOCK_LIFT
  };
}

function makeSlices(w){
  const n = Math.max(20, Math.min(64, Math.round(w.h/6)));
  const holder = w.slicesEl;
  holder.textContent='';
  const NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('class','genie-svg');
  svg.setAttribute('width', window.innerWidth);
  svg.setAttribute('height', window.innerHeight);
  const path=document.createElementNS(NS,'path');
  path.setAttribute('fill','#f1e9dd');
  svg.appendChild(path);
  svg.style.filter='drop-shadow(0 18px 40px rgba(28,20,12,.36)) drop-shadow(0 1px 2px rgba(28,20,12,.17))';
  holder.appendChild(svg);
  w.path=path;

  const sh = w.h/n, ov = 0.75;   /* source px of overlap between bands */
  w.slices=[];
  const frag=document.createDocumentFragment();
  for(let i=0;i<n;i++){
    const bh = (i===n-1) ? sh : sh+ov;
    const sl=document.createElement('div');
    sl.className='slice';
    sl.style.width=w.w+'px';
    sl.style.height=bh+'px';
    const inner=document.createElement('div');
    inner.className='slice-inner';
    inner.style.width=w.w+'px';
    inner.style.height=w.h+'px';
    inner.style.top=(-i*sh)+'px';
    inner.appendChild(w.chrome.cloneNode(true));
    sl.appendChild(inner);
    frag.appendChild(sl);
    w.slices.push(sl);
  }
  holder.appendChild(frag);
  w.sliceH=sh; w.sliceN=n; w.sliceOv=ov;
}

function renderGenie(w,p){
  const geo = geoFor(w);
  const topFrac = EASE_TOP(clamp((p-P_TOP0)/(1-P_TOP0),0,1));
  const botFrac = EASE_BOT(clamp(p/P_BOT1,0,1));
  const ty = w.restY + (geo.dockY - w.restY)*topFrac;
  const by = (w.restY + w.h) + (geo.dockY - (w.restY + w.h))*botFrac;
  const n = w.sliceN, sh = w.sliceH, ov = w.sliceOv, H = w.h;
  /* Bands overlap by `ov` source px: without it the two quads meet on a shared
     edge and the antialiasing of each leaves a hairline of backdrop showing —
     which reads as a cut straight through anything the seam crosses. */
  for(let i=0;i<n;i++){
    const v0 = i*sh, v1 = (i===n-1) ? H : Math.min(H, (i+1)*sh + ov);
    const y0 = ty + (v0/H)*(by-ty), y1 = ty + (v1/H)*(by-ty);
    const a = funnelAt(w, y0, geo), b = funnelAt(w, y1, geo);
    w.slices[i].style.transform = quadMatrix(w.w, v1-v0, a[0],y0, a[1],y0, b[1],y1, b[0],y1);
  }
  /* Silhouette behind the slices: it fills the sub-pixel seams and carries
     the shadow. Every point of the window's own rounded-rect outline is put
     through the same warp as the slices, so the corners follow the card
     exactly instead of being approximated (an approximation folded back on
     itself and spat little wedges out past each corner). Pulled half a pixel
     inwards so it can never poke out from under the slices. */
  const r = Math.min(RADIUS, w.w/2, H/2), K = 10, pts = [];
  const push = (u,v)=>{
    const y = ty + (v/H)*(by-ty);
    const lr = funnelAt(w, y, geo);
    const cx = (lr[0]+lr[1])/2;
    const x = lr[0] + (u/w.w)*(lr[1]-lr[0]);
    const dx = x - cx;
    pts.push([cx + Math.sign(dx)*Math.max(0, Math.abs(dx)-0.5), y]);
  };
  push(r,0); push(w.w-r,0);
  for(let k=1;k<=K;k++){const a=-Math.PI/2+(Math.PI/2)*(k/K); push(w.w-r+r*Math.cos(a), r+r*Math.sin(a));}
  for(let i=1;i<n;i++){const v=(i/n)*H; if(v>r && v<H-r) push(w.w, v);}
  for(let k=0;k<=K;k++){const a=(Math.PI/2)*(k/K); push(w.w-r+r*Math.cos(a), H-r+r*Math.sin(a));}
  push(r,H);
  for(let k=1;k<=K;k++){const a=Math.PI/2+(Math.PI/2)*(k/K); push(r+r*Math.cos(a), H-r+r*Math.sin(a));}
  for(let i=n-1;i>=1;i--){const v=(i/n)*H; if(v>r && v<H-r) push(0, v);}
  for(let k=0;k<=K;k++){const a=Math.PI+(Math.PI/2)*(k/K); push(r+r*Math.cos(a), r+r*Math.sin(a));}
  const d = 'M'+pts.map(q=>q[0].toFixed(2)+' '+q[1].toFixed(2)).join('L')+'Z';
  w.path.setAttribute('d', d);
}

function enterGenie(w){
  if(w.el.classList.contains('genie')) return;
  const ae = document.activeElement;
  let focusPath=null, selS=null, selE=null;
  if(ae && w.chrome.contains(ae)){
    focusPath = indexPath(w.chrome, ae);
    if(ae.selectionStart!=null){selS=ae.selectionStart;selE=ae.selectionEnd;}
  }
  makeSlices(w);
  w.el.classList.add('genie');
  if(focusPath){
    const mid = w.slices[Math.floor(w.slices.length*0.5)];
    const target = resolvePath(mid.querySelector('.chrome'), focusPath);
    if(target && target.focus){
      target.focus({preventScroll:true});
      if(selS!=null && target.setSelectionRange) try{target.setSelectionRange(selS,selE);}catch(e){}
    }
  }
}
function exitGenie(w, keepFocus){
  if(!w.el.classList.contains('genie')) return;
  const ae=document.activeElement;
  let focusPath=null, selS=null, selE=null;
  if(ae && w.slicesEl.contains(ae)){
    focusPath = indexPath(ae.closest('.chrome'), ae);
    if(ae.selectionStart!=null){selS=ae.selectionStart;selE=ae.selectionEnd;}
  }
  w.el.classList.remove('genie');
  w.slicesEl.textContent='';
  w.slices=null;
  if(focusPath && keepFocus){
    const target=resolvePath(w.chrome, focusPath);
    if(target && target.focus){
      target.focus({preventScroll:true});
      if(selS!=null && target.setSelectionRange) try{target.setSelectionRange(selS,selE);}catch(e){}
    }
  }
}
function indexPath(root, node){
  const path=[];
  while(node && node!==root){
    const parent=node.parentNode;
    path.unshift(Array.prototype.indexOf.call(parent.children,node));
    node=parent;
  }
  return node===root?path:null;
}
function resolvePath(root,path){
  let n=root;
  for(const i of path){ if(!n||!n.children[i]) return null; n=n.children[i]; }
  return n;
}
/* every live copy of the form stays in sync */
function syncForm(w, src){
  const chromes=[w.chrome];
  if(w.slices) w.slices.forEach(s=>{const c=s.querySelector('.chrome'); if(c) chromes.push(c);});
  const ref = src.closest('.chrome');
  const path = indexPath(ref, src);
  if(!path) return;
  chromes.forEach(c=>{
    if(c===ref) return;
    const t=resolvePath(c,path);
    if(!t) return;
    if(src.type==='checkbox') t.checked=src.checked;
    else if('value' in src) t.value=src.value;
  });
}

/* ======================================================================= state */
function setP(w,p){
  w.p=p;
  if(p<=0){
    exitGenie(w,true);
    w.el.style.display='';
    place(w);
    return;
  }
  enterGenie(w);
  renderGenie(w,p);
}
function animateTo(w, target, done){
  if(w.anim) cancelAnimationFrame(w.anim.raf);
  const from=w.p, t0=performance.now();
  const dur=DUR*Math.max(0.25, Math.abs(target-from));
  const step=(now)=>{
    const k=clamp((now-t0)/dur,0,1);
    setP(w, from+(target-from)*k);
    if(k<1) w.anim.raf=requestAnimationFrame(step);
    else { w.anim=null; if(done) done(); }
  };
  w.anim={raf:requestAnimationFrame(step)};
}
function minimize(w){
  if(w.state!=='open') return;
  w.state='animating';
  enterGenie(w);
  animateTo(w, 1, ()=>{
    w.state='minimized';
    exitGenie(w,false);
    w.el.style.display='none';
    if(activeWin===w) setActive(null);
  });
}
function restore(w){
  if(w.state!=='minimized') return;
  w.state='animating';
  w.el.style.display='';
  setActive(w);
  setP(w,1);
  animateTo(w, 0, ()=>{ w.state='open'; setP(w,0); });
}
function setActive(w){
  wins.forEach(x=>x.el.classList.toggle('active', x===w));
  activeWin=w;
  if(w) raise(w);
}
let topZ = 10 + WINDOWS.length;
function raise(w){ if(w.el.style.zIndex != topZ) w.el.style.zIndex = ++topZ; }

function closeWin(w){
  if(w.state!=='open') return;
  w.state='closed';
  w.el.classList.add('closing');
  w.slot.classList.remove('running');
  setTimeout(()=>{ w.el.style.display='none'; w.el.classList.remove('closing'); }, 175);
  if(activeWin===w) setActive(null);
}
function openWin(w){
  w.state='open';
  w.el.style.display='';
  w.slot.classList.add('running');
  w.el.classList.add('opening');
  setTimeout(()=>w.el.classList.remove('opening'), 210);
  setActive(w);
}

/* green button / double click: zoom between the rest size and a comfortable fill */
const EASE_ZOOM = bezier(0.32,0.72,0.24,1);
function zoom(w){
  if(w.state!=='open' || w.zoomAnim) return;
  let to;
  if(w.zoomed){ to = w.pre; w.zoomed=false; }
  else{
    w.pre = {x:w.x, y:w.y, w:w.w, h:w.h};
    const vw=window.innerWidth, vh=window.innerHeight;
    const maxW=Math.min(vw-140, 940), maxH=Math.min(vh-190, 560);
    to = {x:Math.round((vw-maxW)/2), y:Math.round((vh-DOCK_SPACE-maxH)/2), w:maxW, h:maxH};
    w.zoomed=true;
  }
  const from={x:w.x,y:w.y,w:w.w,h:w.h}, t0=performance.now(), dur=260;
  const step=(now)=>{
    const k=EASE_ZOOM(clamp((now-t0)/dur,0,1));
    w.x=from.x+(to.x-from.x)*k; w.y=from.y+(to.y-from.y)*k;
    w.w=from.w+(to.w-from.w)*k; w.h=from.h+(to.h-from.h)*k;
    w.restX=w.x; w.restY=w.y;
    place(w);
    if(k<1) w.zoomAnim=requestAnimationFrame(step); else w.zoomAnim=null;
  };
  w.zoomAnim=requestAnimationFrame(step);
}

/* ======================================================================= input */
deskEl.addEventListener('mousedown', (e)=>{
  const winEl = e.target.closest('.win');
  if(!winEl) return;
  const w = wins.find(x=>x.el===winEl);
  if(!w) return;
  setActive(w);
  const dot = e.target.closest('.dot');
  if(dot){
    e.preventDefault();
    const i = Array.prototype.indexOf.call(dot.parentNode.children, dot);
    if(i===0) closeWin(w); else if(i===1) minimize(w); else zoom(w);
    return;
  }
  if(!e.target.closest('.titlebar')) return;
  e.preventDefault();
  if(e.detail===2){ zoom(w); return; }
  startDrag(w, e);
});
document.addEventListener('input', e=>{
  const winEl=e.target.closest('.win'); if(!winEl) return;
  const w=wins.find(x=>x.el===winEl); if(w) syncForm(w,e.target);
});
document.addEventListener('change', e=>{
  const winEl=e.target.closest('.win'); if(!winEl) return;
  const w=wins.find(x=>x.el===winEl); if(w) syncForm(w,e.target);
});

function currentTop(w){
  if(w.p<=0) return w.y;
  const geo=geoFor(w);
  return w.restY + (geo.dockY - w.restY)*EASE_TOP(clamp((w.p-P_TOP0)/(1-P_TOP0),0,1));
}
function startDrag(w, ev){
  if(w.state==='minimized') return;
  if(w.anim){ cancelAnimationFrame(w.anim.raf); w.anim=null; }
  w.state='open';
  const gx = ev.clientX - w.x;
  const gy = ev.clientY - currentTop(w);
  w.el.classList.add('dragging');
  const span = geoFor(w).dockY - w.restY;

  const move = (e)=>{
    const nx = e.clientX - gx;
    const ny = e.clientY - gy;
    const dy = ny - w.restY;
    if(dy<=0){
      w.x=nx; w.y=ny; w.restX=nx; w.restY=ny;
      setP(w,0); place(w);
    }else{
      const q = clamp(dy/span, 0, 1);
      w.x = nx; w.restX = nx;
      setP(w, clamp(P_TOP0 + (1-P_TOP0)*EASE_TOP_INV(q), 0, 1));
    }
  };
  const up = ()=>{
    document.removeEventListener('mousemove',move);
    document.removeEventListener('mouseup',up);
    w.el.classList.remove('dragging');
    if(w.p>0.001){
      w.state='animating';
      if(w.p>0.55) animateTo(w,1,()=>{ w.state='minimized'; exitGenie(w,false); w.el.style.display='none'; });
      else animateTo(w,0,()=>{ w.state='open'; setP(w,0); });
    }
  };
  document.addEventListener('mousemove',move);
  document.addEventListener('mouseup',up);
}

window.addEventListener('resize', ()=>{
  const nx=xoff(), ny=yoff(), dx=nx-curX, dy=ny-curY;
  curX=nx; curY=ny;
  wins.forEach(w=>{ w.x+=dx; w.y+=dy; w.restX+=dx; w.restY+=dy; if(w.pre){w.pre.x+=dx; w.pre.y+=dy;} });
  measureDock();
  wins.forEach(w=>{ place(w); if(w.p>0) renderGenie(w,w.p); });
});

layout();
setActive(wins[3]);

/* lets the animation be scrubbed programmatically */
window.__wins = wins;
window.__genie = function(id,p){
  const w = wins.find(x=>x.cfg.id===id); if(!w) return;
  if(w.anim){cancelAnimationFrame(w.anim.raf); w.anim=null;}
  w.state = p>0 ? 'animating' : 'open';
  w.el.style.display='';
  setP(w,p);
};
window.__mapPoint = function(id,u,v){
  const w = wins.find(x=>x.cfg.id===id); if(!w) return null;
  if(w.p<=0) return {x:w.x+u, y:w.y+v};
  const geo=geoFor(w);
  const ty=w.restY+(geo.dockY-w.restY)*EASE_TOP(clamp((w.p-P_TOP0)/(1-P_TOP0),0,1));
  const by=(w.restY+w.h)+(geo.dockY-(w.restY+w.h))*EASE_BOT(clamp(w.p/P_BOT1,0,1));
  const y=ty+(v/w.h)*(by-ty);
  const lr=funnelAt(w,y,geo);
  return {x: lr[0]+(u/w.w)*(lr[1]-lr[0]), y:y};
};
</script>
