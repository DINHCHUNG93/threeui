<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const root = document.documentElement;
        const palettes = new Set(["mono", "sepia", "azure", "moss", "mauve"]);
        try {
          const savedTheme = localStorage.getItem("threeui-theme");
          const lightPalette = localStorage.getItem("threeui-palette-light");
          const darkPalette = localStorage.getItem("threeui-palette-dark");
          const mode = savedTheme === "light" || savedTheme === "system" ? savedTheme : "dark";
          if (mode === "system") root.removeAttribute("data-theme");
          else root.dataset.theme = mode;
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const scheme = mode === "system" ? (prefersDark ? "dark" : "light") : mode;
          root.dataset.scheme = scheme;
          const palette = scheme === "dark" ? darkPalette : lightPalette;
          root.dataset.palette = palettes.has(palette) ? palette : "mono";
        } catch {
          root.dataset.theme = "dark";
          root.dataset.scheme = "dark";
          root.dataset.palette = "mono";
        }
      })();
    </script>
    <meta
      name="description"
      content="Browse high-quality Three.js hero components, 3D shaders, prompts, and templates with customizable variants. Framework-agnostic. Copy, paste, and ship."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta property="og:site_name" content="ThreeUI" />

    <meta property="og:description" content="Browse high-quality Three.js hero components, 3D shaders, prompts, and templates with customizable variants. Framework-agnostic. Copy, paste, and ship." />

    <link rel="icon" href="/threeui-mark.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
